name: Deploy Supabase Google Calendar

on:
  workflow_dispatch:
    inputs:
      deploy_migrations:
        description: "Apply database migrations with supabase db push"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for secret_name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Required GitHub secret ${secret_name} is not configured."
              missing=1
            fi
          done

          if [ "${{ inputs.deploy_migrations }}" = "true" ] && [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Required GitHub secret SUPABASE_DB_PASSWORD is not configured for deploy_migrations=true."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # Database migrations are not applied by default in this workflow.
      # Apply the migration manually in the Supabase SQL Editor using:
      # supabase/migrations/20260601090000_google_calendar_connections.sql
      - name: Apply Supabase database migrations
        if: ${{ inputs.deploy_migrations == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      # Configure the runtime secrets used by these Edge Functions in the Supabase Dashboard
      # before running this workflow:
      # - GOOGLE_CLIENT_ID
      # - GOOGLE_CLIENT_SECRET
      # - GOOGLE_CALENDAR_REDIRECT_URI
      # - SUPABASE_URL
      # - SUPABASE_SERVICE_ROLE_KEY
      # - SAFRA_VISION_APP_URL
      - name: Deploy google-calendar-oauth-start Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy google-calendar-oauth-start --project-ref "$SUPABASE_PROJECT_ID"

      # The OAuth callback must accept the external redirect from Google, which does not
      # include a Supabase Authorization Bearer header. Callback security relies on the
      # signed state parameter being validated inside the function; all other Google
      # Calendar Edge Functions remain protected by JWT verification.
      - name: Deploy google-calendar-oauth-callback Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy google-calendar-oauth-callback --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy google-calendar-status Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy google-calendar-status --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy google-calendar-disconnect Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy google-calendar-disconnect --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy google-calendar-upsert-event Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy google-calendar-upsert-event --project-ref "$SUPABASE_PROJECT_ID"
