    <script>
      (function () {
        const basePath = "/safra-vision/";
        const query = window.location.search;
        if (query.startsWith("?/")) {
          const decoded = query
            .slice(2)
            .replace(/~and~/g, "&");
          const newPath = `${window.location.pathname}${decoded ? decoded : ""}${window.location.hash}`;
          window.history.replaceState(null, "", newPath);
        }

        const hasSupabaseHash = window.location.hash.includes("access_token=") || window.location.hash.includes("refresh_token=");
        const normalizedPath = window.location.pathname.endsWith("/") ? window.location.pathname : `${window.location.pathname}/`;
        if (hasSupabaseHash && normalizedPath === basePath) {
          window.location.replace(`${basePath}login${window.location.hash}`);
        }
      })();
    </script>
