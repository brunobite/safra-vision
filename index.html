    <script>
      (function () {
        const basePath = "/safra-vision/";
        const loginPath = `${basePath}login`;
        const query = window.location.search;
        const hash = window.location.hash;

        if (query.startsWith("?/")) {
          const decoded = query.slice(2);
          const newPath = `${window.location.pathname}${decoded}${hash}`;
          window.history.replaceState(null, "", newPath);
        }

        const authHashParams = ["access_token=", "refresh_token=", "type=", "expires_at="];
        const hasSupabaseHash = authHashParams.some((param) => window.location.hash.includes(param));
        const isBasePath = window.location.pathname === basePath || window.location.pathname === basePath.slice(0, -1);

        if (hasSupabaseHash && isBasePath) {
          window.history.replaceState(null, "", `${loginPath}${window.location.hash}`);
        }
      })();
    </script>
