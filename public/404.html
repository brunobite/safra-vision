<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Safra 26/27 — Controle Operacional</title>
    <script>
      (function () {
        const pathSegmentsToKeep = 1;
        const pathSegments = window.location.pathname.split("/").filter(Boolean);
        const baseSegments = pathSegments.slice(0, pathSegmentsToKeep);
        const route = pathSegments.slice(pathSegmentsToKeep).join("/");
        const query = window.location.search;
        const hash = window.location.hash;
        const basePath = baseSegments.length > 0 ? `/${baseSegments.join("/")}/` : "/";

        window.location.replace(`${window.location.origin}${basePath}?/${route}${query}${hash}`);
      })();
    </script>
  </head>
  <body></body>
</html>
